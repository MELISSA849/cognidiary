<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDiary - Your Intelligent Diary Companion</title>
    <link rel="stylesheet" href="style_elegant.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-section">
                <svg class="logo-icon" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="25" cy="25" r="23" stroke="url(#gradient)" stroke-width="2"/>
                    <path d="M25 10 C15 15, 15 35, 25 40 C35 35, 35 15, 25 10" fill="url(#gradient)" opacity="0.6"/>
                    <circle cx="18" cy="22" r="2" fill="currentColor"/>
                    <circle cx="32" cy="22" r="2" fill="currentColor"/>
                    <path d="M20 30 Q25 35 30 30" stroke="currentColor" stroke-width="2" fill="none"/>
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
                <div>
                    <h1 class="app-title">SmartDiary</h1>
                    <p class="app-subtitle">Your thoughts, beautifully captured</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-button" id="viewEntriesBtn" title="View all entries">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Card Grid -->
            <div class="card-grid">
                <!-- Mood Detection Card -->
                <div class="feature-card mood-card">
                    <div class="card-header">
                        <div class="card-icon mood-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                                <circle cx="9" cy="9" r="1" fill="currentColor"/>
                                <circle cx="15" cy="9" r="1" fill="currentColor"/>
                            </svg>
                        </div>
                        <h2 class="card-title">Mood Capture</h2>
                    </div>
                    
                    <div class="camera-preview">
                        <video id="videoElement" autoplay muted playsinline></video>
                        <canvas id="canvasElement" style="display: none;"></canvas>
                        <div class="camera-overlay" id="cameraOverlay">
                            <svg class="camera-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            <p>Click to start camera</p>
                        </div>
                    </div>
                    
                    <div class="mood-result" id="moodResult"></div>
                    
                    <div class="card-actions">
                        <button class="btn btn-secondary" id="startCamera">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
                            </svg>
                            Start Camera
                        </button>
                        <button class="btn btn-primary" id="capturePhoto" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            Capture
                        </button>
                        <button class="btn btn-secondary" id="stopCamera" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="6" y="6" width="12" height="12" fill="currentColor"/>
                            </svg>
                            Stop
                        </button>
                    </div>
                </div>

                <!-- Voice Input Card -->
                <div class="feature-card voice-card">
                    <div class="card-header">
                        <div class="card-icon voice-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                                <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </div>
                        <h2 class="card-title">Voice Input</h2>
                    </div>
                    
                    <div class="voice-visualizer">
                        <div class="sound-wave">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                        <p class="voice-status" id="voiceStatus">Ready to listen</p>
                    </div>
                    
                    <div class="card-actions">
                        <button class="btn btn-primary" id="startRecording">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            </svg>
                            Start Speaking
                        </button>
                        <button class="btn btn-danger" id="stopRecording" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <rect x="9" y="9" width="6" height="6" fill="currentColor"/>
                            </svg>
                            Stop
                        </button>
                    </div>
                </div>
            </div>

            <!-- Diary Entry Card -->
            <div class="feature-card entry-card">
                <div class="card-header">
                    <div class="card-icon entry-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <h2 class="card-title">Your Entry</h2>
                    <div class="entry-meta">
                        <span class="word-count" id="wordCount">0 words</span>
                    </div>
                </div>
                
                <form id="diaryForm" class="diary-form">
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="entryTitle" 
                            class="input-field title-input" 
                            placeholder="Give your entry a title..."
                            autocomplete="off"
                        />
                    </div>
                    
                    <div class="form-group">
                        <textarea 
                            id="entryText" 
                            class="input-field text-area" 
                            rows="12" 
                            placeholder="What's on your mind today? Type or use voice input..."
                        ></textarea>
                    </div>
                    
                    <div class="form-group mood-display">
                        <label class="mood-label">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            </svg>
                            Detected Mood
                        </label>
                        <div class="mood-badge" id="moodBadge">
                            <span id="detectedMood">Not detected yet</span>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="clearEntry">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                            Clear
                        </button>
                        <button type="submit" class="btn btn-success">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            Save Entry
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script_elegant.js"></script>
</body>
</html>
